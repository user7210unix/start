<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Drawn in the same purple family as folder.png so the wine filter treats both alike -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6c5fb"/>
      <stop offset="1" stop-color="#9b9aee"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- cast shadow, offset down-right like the folder -->
  <path d="M14,15 L38,23 L38,46 L14,38 Z" fill="#000" opacity=".5" filter="url(#drop)"/>

  <!-- sheet -->
  <path d="M9,8.5 L24,13.6 L33,24 L33,41.5 L9,33.4 Z"
        fill="url(#face)" stroke="#222222" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- folded corner -->
  <path d="M24,13.6 L33,24 L25,21.3 Z" fill="#5f5ec0" stroke="#222222" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- ruled lines, parallel to the top edge -->
  <g stroke="#4c4c99" stroke-width="1.1" opacity=".55" stroke-linecap="round">
    <path d="M13.5,20.6 L28.5,25.7"/>
    <path d="M13.5,25.6 L28.5,30.7"/>
    <path d="M13.5,30.6 L23,33.8"/>
  </g>

  <!-- top-left highlight the way the folder catches light -->
  <path d="M9.8,9.4 L23.4,14" stroke="#e6e5ff" stroke-width="1" opacity=".75" stroke-linecap="round"/>
</svg>
